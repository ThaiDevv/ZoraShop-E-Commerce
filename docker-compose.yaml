version: '3.8'

services:

  postgres:
    image: postgres:16-alpine
    container_name: zorashop-postgres
    environment:
      POSTGRES_DB: zorashop_db
      POSTGRES_USER: zorashop_user
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
volumes:
  postgres_data:
